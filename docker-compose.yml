services:
  mariadb:
    image: mariadb:11
    container_name: ab1-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ab1_dev
      MARIADB_DATABASE: ab1
    volumes:
      - ab1-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ab1-mariadb-data:
